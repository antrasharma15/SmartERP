# KEYbooks CI/CD
#   1. TEST   - runs on every push and pull request
#   2. BUILD  - on push to main: builds the Docker images and publishes them to
#               GitHub Container Registry (ghcr.io), GitHub's free image registry.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - install, syntax check, config test
        working-directory: backend
        run: |
          npm ci
          node --check server.js
          node tests/dbConfig.test.js

      - name: Frontend - install and type-check
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

      - name: Validate docker-compose.yml
        run: docker compose config -q

  publish:
    name: Build and push images
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # lets the built-in token push to ghcr.io
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
            build_args: NEXT_PUBLIC_API_URL=/api
    steps:
      - uses: actions/checkout@v4

      # Registry names must be lowercase.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/keybooks-${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
