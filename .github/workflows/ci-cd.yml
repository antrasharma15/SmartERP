# KEYbooks CI/CD
#   1. TEST   - runs on every push and pull request
#   2. BUILD  - on push to main: builds the Docker images and publishes them to
#               GitHub Container Registry (ghcr.io), GitHub's free image registry.
#   3. DEPLOY - on push to main: connects to AWS EC2 via SSH, pulls latest changes,
#               and restarts Docker containers with zero manual intervention.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - install, syntax check, config test
        working-directory: backend
        run: |
          npm ci
          node --check server.js
          node tests/dbConfig.test.js

      - name: Frontend - install and type-check
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

      - name: Validate docker-compose.yml
        run: docker compose config -q

  publish:
    name: Build and push images
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # lets the built-in token push to ghcr.io
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
            build_args: NEXT_PUBLIC_API_URL=/api
    steps:
      - uses: actions/checkout@v4

      # Registry names must be lowercase.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/keybooks-${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to AWS EC2
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Deploying latest SmartERP build to AWS EC2..."

            if [ -d "$HOME/smarterp-deploy" ]; then
              cd "$HOME/smarterp-deploy"
              echo "📥 Pulling latest Docker images from ghcr.io..."
              sudo docker compose pull
              echo "🔄 Restarting containers with updated images..."
              sudo docker compose up -d
              echo "🧹 Cleaning up dangling images..."
              sudo docker image prune -f
            elif [ -d "$HOME/SmartERP" ]; then
              cd "$HOME/SmartERP"
              echo "📥 Pulling latest code from GitHub main..."
              git pull origin main
              echo "🔄 Rebuilding and restarting containers..."
              sudo docker compose up -d --build --remove-orphans
              sudo docker image prune -f
            else
              echo "❌ Error: Deployment directory not found on server!"
              exit 1
            fi

            echo "📊 Verifying running services status..."
            sudo docker compose ps

            echo "✅ Deployment completed successfully!! Live on http://${{ secrets.EC2_HOST }}"

