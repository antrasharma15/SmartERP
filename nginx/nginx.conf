# KEYbooks load balancer: one public entry point.
# /api/* goes to backend replicas.
# Everything else goes to the Next.js frontend.

events {
    worker_connections 1024;
}

http {
    # Docker DNS resolves "backend" to the backend containers.
    upstream keybooks_backend {
        server backend:5000;
        keepalive 16;
    }

    # Frontend service
    upstream keybooks_frontend {
        server frontend:3000;
        keepalive 16;
    }

    # Log which backend replica handled each API request.
    log_format lb '$remote_addr "$request" -> $status served_by=$upstream_addr time=${request_time}s';
    access_log /dev/stdout lb;
    error_log /dev/stderr warn;

    server {
        listen 80;

        # Backend API
        location /api/ {
            proxy_pass http://keybooks_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Retry another backend replica if one fails.
            proxy_next_upstream error timeout http_502 http_503;
        }

        # Backend health check
        location /health {
            proxy_pass http://keybooks_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        #Backend replica identification
          location /whoami {
            proxy_pass http://keybooks_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
       }   

        # Everything else → Next.js frontend
        location / {
            proxy_pass http://keybooks_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}