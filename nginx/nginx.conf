# KEYbooks load balancer: one entry point (port 5000), many backend copies behind it.
events {
    worker_connections 1024;
}

http {
    # Docker's DNS returns one address per backend replica for the name "backend".
    # Nginx spreads requests across them in round-robin order (the default).
    upstream keybooks_backend {
        server backend:5000;
        keepalive 16;
    }

    # Log which backend replica handled each request.
    log_format lb '$remote_addr "$request" -> $status served_by=$upstream_addr time=${request_time}s';
    access_log /dev/stdout lb;
    error_log  /dev/stderr warn;

    server {
        listen 80;

        location / {
            proxy_pass http://keybooks_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # If a replica fails, retry the request on the next one.
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
