# KEYbooks - run everything with: docker compose up --build

services:

  # -------------------------
  # PostgreSQL Database
  # -------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smarterp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smarterp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------
  # Database Migration
  # -------------------------
  migrate:
    build: ./backend
    command: ["node", "migrations/initDb.js"]
    environment: &backend-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smarterp}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-a-real-env-file}
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: ${APP_ENV:-development}
      PORT: "5000"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # -------------------------
  # Backend
  # -------------------------
  backend:
    build: ./backend
    environment:
      <<: *backend-env
      TRUST_PROXY: "1"

    # Backend is accessible only inside Docker.
    # Nginx will send requests to it.
    expose:
      - "5000"

    # Used when scaling with Docker Compose:
    # docker compose up -d --scale backend=3
    deploy:
      replicas: ${BACKEND_REPLICAS:-3}

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

    restart: unless-stopped

  # -------------------------
  # Next.js Frontend
  # -------------------------
  frontend:
    build:
      context: ./frontend
      args:
        # Browser calls /api through Nginx.
        NEXT_PUBLIC_API_URL: /api

    ports:
      - "3000:3000"

    restart: unless-stopped

  # -------------------------
  # Nginx Load Balancer / Reverse Proxy
  # -------------------------
  nginx:
    image: nginx:1.27-alpine

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    # Public entry point for now.
    # Later, this can become 80:80 / 443:443 for cloud deployment.
    ports:
      - "5000:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

# -------------------------
# Persistent PostgreSQL Volume
# -------------------------
volumes:
  pgdata: