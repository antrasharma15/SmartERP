# KEYbooks - run everything with:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smarterp}
    volumes:
      - pgdata:/var/lib/postgresql/data   # keeps your data when the container is deleted
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smarterp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-time job: creates all tables, then exits. Safe to re-run (uses IF NOT EXISTS).
  migrate:
    build: ./backend
    command: ["node", "migrations/initDb.js"]
    environment: &backend-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smarterp}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-a-real-env-file}
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: ${APP_ENV:-development}
      PORT: "5000"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment: *backend-env
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
